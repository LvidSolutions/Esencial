name: CMS staging build

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-published]

permissions:
  contents: write

concurrency:
  group: cms-staging-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Build published CMS content
        id: cms_build
        run: pnpm run build:cms
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_PROJECT_ID: g6xm8j7l
          SANITY_DATASET: production
      - name: Commit generated website
        run: |
          git config user.name "Esencial CMS build"
          git config user.email "cms-build@users.noreply.github.com"
          git add -- public
          git diff --cached --quiet || git commit -m "Build website from published Sanity content"
          git push
      - name: Write editor-friendly result
        if: always()
        run: |
          {
            echo "## CMS staging build"
            if [ "${{ steps.cms_build.outcome }}" = "success" ]; then
              echo "✅ Published CMS content passed validation and the generated site was pushed to \`main\`. Vercel staging will deploy that commit."
              echo ""
              echo "If staging does not change, open the Vercel deployment for this commit."
            else
              echo "❌ No website files were pushed. The prior staging deployment remains in place."
              echo ""
              echo "Open **Build published CMS content** above: its first validation error tells you which project, translation, SEO field or image needs attention."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
